name: "Node Backend Project" 
on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
jobs:
  build:
    runs-on: ubuntu-latest    
    defaults:
      run:
        working-directory: ./backend
    steps:
      # Step 1: Clone your repository's code onto the virtual machine
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Install your project dependencies cleanly
      - name: Install dependencies
        run: npm ci
      
      # Step 3: Run your linter or build script (Optional: comment out if you don't have this yet)
      - name: Build project
        run: npm run build --if-present

      # Step 4: Run your automated tests
      - name: Run tests
        run: npm test

      # Step 5: Run a simple terminal command
      - name: Say Success
        run: echo "The Node Backend Code has cloned and test run successfully. Ready to go!"
